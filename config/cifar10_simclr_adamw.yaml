# SimCLR, shared AdamW recipe, CIFAR-10: ResNet-18, 1000 epochs, batch 128, seed 5, 1 GPU.
# Evaluation (shared by all methods): python -m scoreclr.evaluation
method: simclr
seed: 5
output_dir: runs/cifar10_simclr_adamw
data:
  dataset: cifar10
  root: ./datasets
  crop_size: 32
  num_workers: 8
  augment:
    crop_scale: [0.08, 1.0]
    color_jitter: {prob: 0.8, brightness: 0.8, contrast: 0.8, saturation: 0.8, hue: 0.2}
    grayscale_prob: 0.2
    blur_prob: 0.5
    flip_prob: 0.5
model: {backbone: resnet18, proj_hidden_dim: 2048, proj_dim: 256}
loss: {temperature: 0.2}
optim: {epochs: 1000, batch_size: 128, lr: 0.0002, weight_decay: 1.0e-06, classifier_lr: 0.01,
  cosine_decay_epochs: 100, grad_clip: 1.0}
eval: {every: 10}
wandb:
  enabled: false
  project: scoreclr
  entity: null
  group: null
  tags: []
